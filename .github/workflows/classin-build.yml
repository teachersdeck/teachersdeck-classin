name: ClassIn build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build ClassIn site (self-checking)
        run: python3 tools/build_classin.py

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: classin-site
          path: build/classin-site
          retention-days: 14
